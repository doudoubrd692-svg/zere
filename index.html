<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DZ OrderHub</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b0a0f;color:#f7f7fb;font-family:Arial,sans-serif}*{box-sizing:border-box}.card{background:#141319;border:1px solid #ffffff12;border-radius:18px}.muted{color:#ffffff66}.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;border:1px solid #ffffff18}.side{background:#111016;border-left:1px solid #ffffff12}.nav{padding:11px 14px;border-radius:12px;color:#aaa}.nav:hover,.nav.active{background:#7c3aed22;color:#c4b5fd}.btn{border-radius:11px;padding:10px 14px;font-size:13px;font-weight:700}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px}.hidden{display:none!important}</style></head><body>
<aside class="side fixed right-0 top-0 h-screen w-64 p-5 z-20"><div class="text-2xl font-black mb-8">DZ Order<span class="text-violet-400">Hub</span></div><div class="text-xs muted mb-4">إدارة الطلبات والتوصيل</div><nav class="space-y-2"><div class="nav active" data-view="dashboard">لوحة التحكم</div><div class="nav" data-view="orders">الطلبات</div><div class="nav" data-view="confirm">تأكيد الطلبات</div><div class="nav" data-view="shipments">الشحنات</div><div class="nav" data-view="settings">شركات التوصيل والإعدادات</div></nav><div class="absolute bottom-5 right-5 left-5 card p-4"><div class="text-xs muted">الحساب</div><div class="mt-2">Administrateur</div><div class="text-xs text-emerald-400 mt-1">● متصل</div></div></aside>
<main class="mr-64 p-6 min-h-screen"><header class="flex items-end justify-between mb-7"><div><div class="text-sm muted">مرحبًا 👋</div><h1 id="title" class="text-3xl font-black mt-1">لوحة التحكم</h1><p id="subtitle" class="muted text-sm mt-1">مركز التحكم في طلبات Shopify والتوصيل</p></div><div class="flex gap-2"><a href="/api/export.csv" class="btn bg-white/10">تصدير CSV</a><button class="btn bg-violet-600" onclick="refresh()">تحديث</button></div></header><div id="app"></div></main>
<div id="modal" class="modal hidden"><div class="card max-w-3xl w-full max-h-[90vh] overflow-auto p-6"><div class="flex justify-between"><h2 id="mtitle" class="text-xl font-black"></h2><button class="btn bg-white/10" onclick="closeModal()">إغلاق</button></div><div id="mbody" class="mt-5"></div></div></div>
<script>
const L={NEW:'جديد',PENDING_CONFIRMATION:'يحتاج تأكيد',CONFIRMED:'مؤكد',NO_ANSWER:'لم يرد',CALL_BACK:'معاودة الاتصال',CANCELLED:'ملغى',READY_TO_SHIP:'جاهز للشحن',SENT_TO_COURIER:'أرسل للتوصيل',IN_TRANSIT:'قيد التوصيل',OUT_FOR_DELIVERY:'خرج للتوصيل',DELIVERED:'تم التسليم',REFUSED:'مرفوض',RETURNED:'مرتجع'};
const cls={CONFIRMED:'text-emerald-300 bg-emerald-500/10',PENDING_CONFIRMATION:'text-amber-300 bg-amber-500/10',NO_ANSWER:'text-orange-300 bg-orange-500/10',CALL_BACK:'text-yellow-300 bg-yellow-500/10',CANCELLED:'text-red-300 bg-red-500/10',DELIVERED:'text-green-300 bg-green-500/10',RETURNED:'text-red-300 bg-red-500/10',IN_TRANSIT:'text-blue-300 bg-blue-500/10',SENT_TO_COURIER:'text-blue-300 bg-blue-500/10',NEW:'text-violet-300 bg-violet-500/10'};
let orders=[];let current='dashboard';
async function api(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'حدث خطأ');return d}
function badge(s){return `<span class="badge ${cls[s]||'text-white/60 bg-white/5'}">${L[s]||s}</span>`}
async function refresh(){if(current==='dashboard')return dashboard();if(current==='orders')return ordersView();if(current==='confirm')return confirmView();if(current==='shipments')return shipmentView();return settingsView()}
async function dashboard(){document.getElementById('title').textContent='لوحة التحكم';document.getElementById('subtitle').textContent='نظرة شاملة على الطلبات والتأكيد والتوصيل';const d=await api('/api/dashboard');const o=await api('/api/orders');orders=o;document.getElementById('app').innerHTML=`<div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-3">${[['إجمالي',d.total,'text-white'],['تحتاج تأكيد',d.pending,'text-amber-300'],['مؤكد',d.confirmed,'text-emerald-300'],['نسبة التأكيد',d.confirmationRate+'%','text-violet-300'],['لم يرد',d.noAnswer,'text-orange-300'],['قيد التوصيل',d.inTransit,'text-blue-300'],['تم التسليم',d.delivered,'text-cyan-300']].map(x=>`<div class="card p-4"><div class="text-xs muted">${x[0]}</div><div class="text-2xl font-black mt-3 ${x[2]}">${x[1]}</div></div>`).join('')}</div><div class="card mt-6 overflow-hidden"><div class="p-5 border-b border-white/10 flex justify-between"><div><b>آخر الطلبات</b><div class="text-xs muted mt-1">الطلبات الواردة من Shopify</div></div><button class="text-violet-300 text-sm" onclick="show('confirm')">طابور التأكيد ←</button></div>${table(o.slice(0,10))}</div>`}
function table(list){return `<div class="overflow-x-auto"><table class="w-full text-right text-sm"><thead class="text-xs muted"><tr class="border-b border-white/10"><th class="p-4">الطلب</th><th>العميل</th><th>الولاية</th><th>المبلغ</th><th>الحالة</th><th>التوصيل</th><th></th></tr></thead><tbody>${list.map(o=>`<tr class="border-b border-white/5 hover:bg-white/[.02]"><td class="p-4 font-bold text-violet-300">${o.orderNumber}</td><td>${o.customerName}<div class="text-xs muted">${o.phone}</div></td><td>${o.wilaya}<div class="text-xs muted">${o.commune||''}</div></td><td class="font-bold">${Number(o.total).toLocaleString('fr-DZ')} DA</td><td>${badge(o.status)}</td><td>${o.courier?.name||'—'}</td><td><button class="btn bg-white/10" onclick="detail('${o.id}')">فتح</button></td></tr>`).join('')}</tbody></table></div>`}
async function ordersView(){document.getElementById('title').textContent='الطلبات';document.getElementById('subtitle').textContent='بحث وتصفية وإدارة كل الطلبات';orders=await api('/api/orders');document.getElementById('app').innerHTML=`<div class="card p-4 mb-4"><div class="flex gap-2"><input id="q" class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 outline-none" placeholder="بحث بالاسم، الهاتف، رقم الطلب أو التتبع..."><button class="btn bg-violet-600" onclick="filterOrders()">بحث</button></div><div class="flex flex-wrap gap-2 mt-3">${['','PENDING_CONFIRMATION','CONFIRMED','NO_ANSWER','CALL_BACK','SENT_TO_COURIER','IN_TRANSIT','DELIVERED','RETURNED'].map(s=>`<button class="btn bg-white/5" onclick="filterStatus('${s}')">${s?L[s]:'الكل'}</button>`).join('')}</div></div><div class="card overflow-hidden">${table(orders)}</div>`}
async function filterOrders(){const q=document.getElementById('q').value;document.getElementById('app').querySelector('.card:last-child').innerHTML=table(await api('/api/orders?q='+encodeURIComponent(q)))}
async function filterStatus(s){document.getElementById('app').querySelector('.card:last-child').innerHTML=table(await api('/api/orders'+(s?'?status='+s:'')))}
async function confirmView(){document.getElementById('title').textContent='تأكيد الطلبات';document.getElementById('subtitle').textContent='واجهة الموظفين — وصول محدود';const list=await api('/api/orders');const q=list.filter(o=>['NEW','PENDING_CONFIRMATION','NO_ANSWER','CALL_BACK'].includes(o.status));document.getElementById('app').innerHTML=`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${q.map(o=>`<div class="card p-5"><div class="flex justify-between"><div><b>${o.orderNumber}</b><div class="text-xs muted mt-1">${o.customerName}</div></div>${badge(o.status)}</div><div class="mt-5 space-y-2 text-sm"><div class="flex justify-between"><span class="muted">الهاتف</span><a class="text-emerald-300" href="tel:${o.phone}">${o.phone}</a></div><div class="flex justify-between"><span class="muted">الموقع</span><span>${o.wilaya} / ${o.commune||''}</span></div><div class="flex justify-between"><span class="muted">المبلغ</span><b>${Number(o.total).toLocaleString('fr-DZ')} DA</b></div></div><div class="grid grid-cols-2 gap-2 mt-5"><button class="btn bg-emerald-600" onclick="setStatus('${o.id}','CONFIRMED')">✓ تأكيد</button><button class="btn bg-orange-600/70" onclick="setStatus('${o.id}','NO_ANSWER')">لم يرد</button><button class="btn bg-yellow-600/70" onclick="setStatus('${o.id}','CALL_BACK')">معاودة</button><button class="btn bg-red-600/70" onclick="setStatus('${o.id}','CANCELLED')">إلغاء</button></div></div>`).join('')}</div>${!q.length?'<div class="card p-16 text-center muted">🎉 لا توجد طلبات تنتظر التأكيد.</div>':''}`}
async function setStatus(id,status){try{await api('/api/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await refresh()}catch(e){alert(e.message)}}
async function shipmentView(){document.getElementById('title').textContent='الشحنات';document.getElementById('subtitle').textContent='إرسال الطلبات المؤكدة إلى شركات التوصيل';const list=await api('/api/orders');const q=list.filter(o=>['CONFIRMED','READY_TO_SHIP','SENT_TO_COURIER','IN_TRANSIT','OUT_FOR_DELIVERY'].includes(o.status));document.getElementById('app').innerHTML=`<div class="card overflow-hidden">${table(q)}</div>`}
async function settingsView(){document.getElementById('title').textContent='شركات التوصيل والإعدادات';document.getElementById('subtitle').textContent='التكاملات والحسابات والصلاحيات';const cs=await api('/api/couriers');const us=await api('/api/users');document.getElementById('app').innerHTML=`<div class="grid lg:grid-cols-2 gap-4"><section class="card p-5"><h2 class="font-bold">شركات التوصيل</h2><p class="muted text-sm mt-1">جاهز لتوصيل Ecom Delivery وإضافة بقية الشركات كـAdapters.</p><div class="space-y-3 mt-4">${cs.map(c=>`<div class="rounded-xl border border-white/10 p-4"><div class="flex justify-between"><b>${c.name}</b><span class="text-emerald-300 text-xs">${c.enabled?'مفعلة':'متوقفة'}</span></div><div class="text-xs muted mt-2">${c.type} · الأولوية ${c.priority}</div></div>`).join('')}</div><div class="mt-4 text-xs text-white/35">Ecom Delivery: API Key + API Token محفوظان في .env ولا يظهران للموظف.</div></section><section class="card p-5"><h2 class="font-bold">الموظفون والصلاحيات</h2><div class="space-y-3 mt-4">${us.map(u=>`<div class="rounded-xl border border-white/10 p-4 flex justify-between"><div><b>${u.name}</b><div class="text-xs muted mt-1">${u.email}</div></div><span class="badge bg-violet-500/10 text-violet-300">${u.role}</span></div>`).join('')}</div><div class="mt-5 rounded-xl bg-white/[.03] p-4 text-xs muted">ORDER_AGENT يستطيع التأكيد/المعاودة/الإلغاء فقط. لا يرى مفاتيح API ولا إعدادات النظام.</div></section><section class="card p-5 lg:col-span-2"><h2 class="font-bold">WhatsApp Automation</h2><div class="grid md:grid-cols-3 gap-3 mt-4"><div class="rounded-xl bg-white/[.03] p-4">✓ عند تأكيد الطلب</div><div class="rounded-xl bg-white/[.03] p-4">✓ عند إنشاء الشحنة</div><div class="rounded-xl bg-white/[.03] p-4">✓ عند خرج للتوصيل / التسليم</div></div><p class="muted text-xs mt-4">التكامل يستخدم WhatsApp Cloud API الرسمي عند إضافة بيانات Meta في .env.</p></section></div>`}
async function detail(id){const o=await api('/api/orders/'+id);document.getElementById('mtitle').textContent=o.orderNumber+' — '+o.customerName;document.getElementById('mbody').innerHTML=`<div class="grid md:grid-cols-2 gap-4"><div class="card p-4"><div class="text-xs muted">الحالة</div><div class="mt-2">${badge(o.status)}</div><div class="mt-4 text-sm space-y-2"><div>📞 <a class="text-emerald-300" href="tel:${o.phone}">${o.phone}</a></div><div>📍 ${o.wilaya} / ${o.commune||''}</div><div>🏠 ${o.address||'—'}</div><div>💰 <b>${Number(o.total).toLocaleString('fr-DZ')} DA</b></div><div>🚚 ${o.courier?.name||'لم تحدد'}</div><div>🔎 ${o.trackingNumber||'—'}</div></div></div><div class="card p-4"><b>Timeline</b><div class="mt-4 space-y-3">${o.events.map(e=>`<div class="border-r-2 border-violet-500/40 pr-3"><div class="text-xs muted">${new Date(e.at).toLocaleString('ar-DZ')}</div><div class="text-sm mt-1">${e.message}</div></div>`).join('')}</div></div></div><div class="mt-4 flex gap-2">${['CONFIRMED','NO_ANSWER','CALL_BACK','CANCELLED'].map(s=>`<button class="btn ${s==='CONFIRMED'?'bg-emerald-600':s==='CANCELLED'?'bg-red-600':'bg-white/10'}" onclick="setStatusAndClose('${o.id}','${s}')">${L[s]}</button>`).join('')}</div>`;document.getElementById('modal').classList.remove('hidden')}
async function setStatusAndClose(id,s){await setStatus(id,s);closeModal();}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function show(v){current=v;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===v));refresh()}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>show(n.dataset.view));refresh();
</script></body></html>
